# Deliverance — database configuration
# Development + test run on the LOCAL Docker Postgres service ("db").
# Production points at Neon, read from NEON_DATABASE_URL — used later, for seeding/deploy.
#
# Why NEON_DATABASE_URL and not DATABASE_URL: a bare DATABASE_URL is auto-applied by Rails to
# whatever environment is running, including the test suite (which truncates tables). A custom
# name, referenced only inside the production block, can never leak onto the local/test runs.
# The production URL is also guarded with `if Rails.env.production?` because database.yml is
# ERB-parsed in every environment.

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "db" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  username: <%= ENV.fetch("DB_USER") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "postgres" } %>

development:
  <<: *default
  database: deliverance_development

test:
  <<: *default
  database: deliverance_test

production:
  <<: *default
  url: <%= ENV["NEON_DATABASE_URL"] if Rails.env.production? %>
